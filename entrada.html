<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servidor do Marreco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12181A;--rune:#8FB8A8;--rune-dim:#5C7A70;--ink:#E9EEEC;--muted:#8FA098}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;padding:2rem;background-image:radial-gradient(ellipse at top,rgba(143,184,168,.08),transparent 62%)}
main{width:min(100%,30rem);text-align:center}
.brasao{display:block;width:320px;max-width:88%;height:auto;margin:0 auto 1.5rem;border-radius:6px}
h1{font-family:Cinzel,serif;font-weight:700;font-size:2rem;letter-spacing:.02em;margin:0;color:var(--ink)}
.sub{color:var(--muted);font-size:1rem;margin:.45rem 0 1.2rem}
.rune-divider{color:var(--rune-dim);letter-spacing:.5em;font-size:.9rem}
footer{color:var(--rune-dim);font-size:.8rem;margin-top:2.5rem}
</style>
</head>
<body>
<main>
  <img class="brasao" src="brasao_marreco_base.jpg" alt="Brasão do Marreco">
  <h1>Servidor do Marreco</h1>
  <p class="sub">Bem-vindo</p>
  <div class="rune-divider">✦ ✦ ✦</div>
  <footer>Escolha um servidor para continuar</footer>
</main>
</body>
</html>
