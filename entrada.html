<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servidor do Marreco</title>
<link rel="icon" type="image/x-icon" href="favicon_patinho_amarelo.ico?v=4">
<link rel="shortcut icon" type="image/x-icon" href="favicon_patinho_amarelo.ico?v=4">
<link rel="icon" type="image/png" sizes="64x64" href="favicon_patinho_amarelo.png?v=4">



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12181A;--rune:#8FB8A8;--rune-dim:#5C7A70;--ink:#E9EEEC;--muted:#8FA098}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;padding:2rem;background-image:radial-gradient(ellipse at top,rgba(143,184,168,.08),transparent 62%)}
main{width:min(100%,30rem);text-align:center}
.brasao{display:block;width:320px;max-width:88%;height:auto;margin:0 auto 1.5rem;border-radius:6px}
h1{font-family:Cinzel,serif;font-weight:700;font-size:2rem;letter-spacing:.02em;margin:0;color:var(--ink)}
.sub{color:var(--muted);font-size:1rem;margin:.45rem 0 1.2rem}
.rune-divider{color:var(--rune-dim);letter-spacing:.5em;font-size:.9rem}
footer{color:var(--rune-dim);font-size:.8rem;margin-top:2.5rem}.btn{display:block;width:100%;padding:.85rem 1rem;border-radius:8px;border:1px solid var(--rune);background:var(--rune);color:var(--bg);font:600 1rem inherit;cursor:pointer;margin:1.5rem auto 0}.btn:disabled{opacity:.5;cursor:default}.progress{color:var(--muted);font-size:.86rem;min-height:1.3em;margin:.65rem 0 0}.status-stack{display:flex;flex-direction:column;gap:.65rem;margin:1.5rem auto 0}.status-real{display:flex;align-items:center;justify-content:center;gap:.65rem;line-height:1;color:var(--muted);font-size:.95rem}.status-dot{display:inline-block;width:1rem;height:1rem;min-width:1rem;border-radius:50%;background:#293133;border:1px solid #4B5958;box-shadow:inset 2px 2px 3px rgba(0,0,0,.55),inset -1px -1px 2px rgba(255,255,255,.08)}.status-real.on{color:var(--rune)}.status-real.on .status-dot{background:radial-gradient(circle at 35% 30%,#E7FFF4 0 12%,var(--rune) 42%,#477565 100%);border-color:var(--rune);box-shadow:0 0 5px var(--rune),0 0 14px rgba(143,184,168,.65),inset -2px -2px 3px rgba(0,0,0,.25)}.status-real.off{color:var(--ember,#C97B4A)}.status-real.off .status-dot{background:radial-gradient(circle at 35% 30%,#FFE8DC 0 10%,var(--ember,#C97B4A) 42%,#713C2C 100%);border-color:var(--ember,#C97B4A);box-shadow:0 0 5px var(--ember,#C97B4A),0 0 14px rgba(201,123,74,.5),inset -2px -2px 3px rgba(0,0,0,.25)}.status-real.unavailable{color:var(--muted)}.join-code-box{margin:1.1rem auto 0;text-align:center;color:var(--muted)}.join-code-label{display:block;font-size:.82rem;margin-bottom:.3rem}.join-code-value{display:inline-block;font-family:ui-monospace,SFMono-Regular,monospace;font-size:1.25rem;letter-spacing:.08em;color:var(--rune);border:1px solid var(--rune-dim);border-radius:8px;padding:.45rem .8rem}
</style>
</head>
<body>
<main>
  <img id="brasaoJogo" class="brasao" src="brasao_marreco_base.jpg" alt="Brasão do Marreco">
  <h1>Servidor do Marreco</h1>
  <p class="sub">Bem-vindo</p>
  <div class="rune-divider">✦ ✦ ✦</div>
  <div class="status-stack" aria-live="polite">
    <div id="machineStatus" class="status-real unavailable"><span class="status-dot"></span><span id="machineLabel">Máquina INDISPONÍVEL</span></div>
    <div id="serverStatus" class="status-real unavailable"><span class="status-dot"></span><span id="serverLabel">Servidor INDISPONÍVEL</span></div>
  </div>
  <div id="joinCodeBox" class="join-code-box" hidden><span class="join-code-label">Join Code</span><strong id="joinCodeValue" class="join-code-value"></strong></div>
  <button id="btnLigar" class="btn" type="button" hidden>Ligar Máquina/Servidor</button>
  <button id="btnJoin" class="btn" type="button" hidden>Exibir Join Code</button>
  <p id="progress" class="progress" aria-live="polite"></p>
  <footer>Escolha um servidor para continuar</footer>
  <script>
    const WORKER_URL='https://white-brook-c32d.ogioni-bh.workers.dev';
    const SENHA='crbr';
    let ultimoStatus=null, inicializando=false;
    function nomeDoJogo(data){return typeof data.jogo==='string' && data.jogo.trim() ? data.jogo.trim() : 'Jogo não identificado';}
    function atualizarBrasao(data){
      const img=document.getElementById('brasaoJogo');
      // O mapa receberá os brasões temáticos quando forem criados; por enquanto mantém a base oficial.
      const brasoes={
        'valheim':'brasao_valheim.jpg',
        'runescape: dragonwilds':'brasao_runescape.png'
      };
      const jogo=nomeDoJogo(data).trim().toLowerCase();
      img.src=brasoes[jogo] || 'brasao_marreco_base.jpg';
      img.alt='Brasão do '+(nomeDoJogo(data)==='Jogo não identificado'?'Marreco':nomeDoJogo(data));
    }
    async function atualizarJoinCode(ativo){
      const box=document.getElementById('joinCodeBox'), value=document.getElementById('joinCodeValue');
      if(!ativo){box.hidden=true;value.textContent='';return;}
      try{
        const r=await fetch(WORKER_URL+'/joincode?senha='+encodeURIComponent(SENHA)+'&ts='+Date.now(),{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const data=await r.json();
        if(data.joincode){value.textContent=data.joincode;box.hidden=false;}
        else{value.textContent='Aguardando Join Code...';box.hidden=false;}
      }catch(e){box.hidden=true;value.textContent='';}
    }
    function atualizarLed(id,labelId,texto,estado){
      const box=document.getElementById(id), label=document.getElementById(labelId);
      if(estado===true){box.className='status-real on';label.textContent=texto+' LIGADA';}
      else if(estado===false){box.className='status-real off';label.textContent=texto+' DESLIGADA';}
      else{box.className='status-real unavailable';label.textContent=texto+' INDISPONÍVEL';}
    }
    function aplicarStatus(data){
      ultimoStatus=data;
      atualizarLed('machineStatus','machineLabel','Máquina',data.maquina===true);
      const server=document.getElementById('serverStatus'), label=document.getElementById('serverLabel');
      if(data.servidor===true){server.className='status-real on';label.textContent='Servidor LIGADO — Jogo Atual: '+nomeDoJogo(data);}
      else if(data.servidor===false){server.className='status-real off';label.textContent='Servidor DESLIGADO';}
      else{server.className='status-real unavailable';label.textContent='Servidor INDISPONÍVEL';}
      atualizarBrasao(data);
      const btn=document.getElementById('btnLigar');
      const joinBtn=document.getElementById('btnJoin');
      const maquinaOff=data.maquina===false;
      const servidorOff=data.maquina===true && data.servidor===false;
      const valheimLigado=data.servidor===true && nomeDoJogo(data).toLowerCase()==='valheim';
      btn.hidden=!(maquinaOff || servidorOff) || inicializando;
      btn.disabled=inicializando;
      btn.textContent=maquinaOff?'Ligar Máquina/Servidor':'Ligar Servidor';
      joinBtn.hidden=!valheimLigado || inicializando;
      joinBtn.disabled=inicializando;
    }
    async function lerStatus(){
      const r=await fetch(WORKER_URL+'/status.json?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data=await r.json();
      if(data.esp!==true) throw new Error('ESP indisponível');
      return data;
    }
    async function atualizarStatus(){
      try{aplicarStatus(await lerStatus());}
      catch(e){
        ultimoStatus=null; atualizarLed('machineStatus','machineLabel','Máquina',null);
        const server=document.getElementById('serverStatus');server.className='status-real unavailable';document.getElementById('serverLabel').textContent='Servidor INDISPONÍVEL';
        atualizarJoinCode(false);
        document.getElementById('btnLigar').hidden=true;
        document.getElementById('btnJoin').hidden=true;
      }
    }
    async function ligarServidor(){
      const data=ultimoStatus;
      if(data && data.maquina===true && data.servidor===false){
        alert('A escolha do servidor ainda será implementada. Nenhum servidor foi iniciado.');
        return;
      }
      const senha=prompt('Digite a senha para ligar a máquina:');
      if(senha===null) return;
      if(senha!==SENHA){alert('Senha inválida.');return;}
      const btn=document.getElementById('btnLigar'), progress=document.getElementById('progress');
      inicializando=true;btn.hidden=true;btn.disabled=true;progress.textContent='Enviando comando para ligar a máquina...';
      try{
        const r=await fetch(WORKER_URL+'/ligar?senha='+encodeURIComponent(senha)+'&ts='+Date.now(),{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        for(let i=0;i<40;i++){
          await new Promise(resolve=>setTimeout(resolve,3000));
          let novo;try{novo=await lerStatus();}catch(e){continue;}
          aplicarStatus(novo);
          progress.textContent=novo.maquina===true?'Máquina ligada. Escolha o servidor para iniciar.':'Ligando máquina...';
          if(novo.maquina===true){inicializando=false;progress.textContent='';aplicarStatus(novo);return;}
        }
        progress.textContent='A máquina ainda está iniciando. Atualize em alguns segundos.';
      }catch(e){progress.textContent='Não foi possível enviar o comando.';}
      inicializando=false;await atualizarStatus();
    }
    async function exibirJoinCode(){
      const senha=prompt('Digite a senha para exibir o Join Code:');
      if(senha===null) return;
      if(senha!==SENHA){alert('Senha inválida.');return;}
      await atualizarJoinCode(true);
    }
    document.getElementById('btnLigar').addEventListener('click',ligarServidor);
    document.getElementById('btnJoin').addEventListener('click',exibirJoinCode);
    atualizarStatus();
    setInterval(atualizarStatus,15000);
  </script>
</main>
</body>
</html>
