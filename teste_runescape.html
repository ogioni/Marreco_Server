<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servidor do Marreco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12181A; --panel:#1B2427; --rune:#8FB8A8; --rune-dim:#5C7A70;
  --ember:#C97B4A; --ink:#E9EEEC; --muted:#8FA098; --rule:#2A3538;
}
:root:not([data-theme="light"]){ }
:root[data-theme="light"]{
  --bg:#EFEDE4; --panel:#FFFFFF; --rune:#3D6B58; --rune-dim:#7C9689;
  --ember:#B85C2E; --ink:#1C231F; --muted:#5B665F; --rule:#DAD5C6;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  background-image:
    radial-gradient(ellipse at top, rgba(143,184,168,0.06), transparent 60%);
}
.wrap{max-width:30rem;margin:0 auto;padding:2.5rem 1.25rem 3rem}
h1{
  font-family:Cinzel,serif;font-weight:700;font-size:1.9rem;
  letter-spacing:.02em;margin:0 0 .3rem;text-align:center;color:var(--ink);
}
.sub{text-align:center;color:var(--muted);font-size:.95rem;margin:0 0 .9rem}
.rune-divider{
  text-align:center;color:var(--rune-dim);letter-spacing:.5em;
  font-size:.9rem;margin:0 0 2rem;
}
.card{
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:1.4rem 1.3rem;margin-bottom:1.1rem;
}
.status-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.2rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.on{background:var(--rune);box-shadow:0 0 8px var(--rune)}
.dot.off{background:#6b4a3a}
.status-text{font-family:Cinzel,serif;font-weight:600;font-size:1.05rem}
.status-detail{color:var(--muted);font-size:.88rem;margin-top:.5rem;line-height:1.6}
.status-detail strong{color:var(--ink);font-weight:600}

.btn{
  display:block;width:100%;padding:.95rem 1rem;margin-bottom:.8rem;
  border-radius:8px;border:1px solid var(--rule);background:transparent;
  color:var(--ink);font-family:"Source Sans 3",sans-serif;font-weight:600;
  font-size:1rem;cursor:pointer;transition:border-color .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;text-align:center;text-decoration:none;
  box-sizing:border-box;
}
.btn:active{transform:scale(.98)}
.btn-ligar{background:var(--rune);color:var(--bg);border-color:var(--rune)}.btn-join{border-color:var(--rune);color:var(--rune)}
.btn-desligar{border-color:#8a4a34;color:#c97b4a}
.btn-status{color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default;transform:none}

.log{
  font-size:.85rem;color:var(--muted);text-align:center;
  min-height:1.4em;margin-top:.3rem;
}
.log.ok{color:var(--rune)}
.log.err{color:var(--ember)}

footer{text-align:center;color:var(--rune-dim);font-size:.8rem;margin-top:2rem}
.brasao{display:block!important;width:320px!important;max-width:100%!important;height:auto!important;margin:0 auto 1.2rem;border-radius:6px;}\n
.status-real #statusLabel{display:inline-block;margin-left:2rem}.status-real{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin:0 auto 1.1rem;line-height:1;color:var(--muted);font-size:.95rem}.status-real .status-dot{display:inline-block;width:1rem;height:1rem;min-width:1rem;border-radius:50%;background:#293133;border:1px solid #4B5958;box-shadow:inset 2px 2px 3px rgba(0,0,0,.55),inset -1px -1px 2px rgba(255,255,255,.08)}.status-real.on{color:var(--rune)}.status-real.on .status-dot{background:radial-gradient(circle at 35% 30%,#E7FFF4 0 12%,var(--rune) 42%,#477565 100%);border-color:var(--rune);box-shadow:0 0 5px var(--rune),0 0 14px rgba(143,184,168,.65),inset -2px -2px 3px rgba(0,0,0,.25);animation:ledPulse 2s ease-in-out infinite}.status-real.off{color:var(--ember)}.status-real.off .status-dot{background:radial-gradient(circle at 35% 30%,#FFE8DC 0 10%,var(--ember) 42%,#713C2C 100%);border-color:var(--ember);box-shadow:0 0 5px var(--ember),0 0 14px rgba(201,123,74,.5),inset -2px -2px 3px rgba(0,0,0,.25);animation:ledPulse 2s ease-in-out infinite}.status-real.unavailable{color:var(--muted)}.status-real.unavailable .status-dot{background:#252D2E;border-color:#3B4746;box-shadow:inset 2px 2px 3px rgba(0,0,0,.65),inset -1px -1px 2px rgba(255,255,255,.06)}@keyframes ledPulse{0%,100%{filter:brightness(.82)}50%{filter:brightness(1.18)}}

.join-code-box{margin:0 auto 1.4rem;text-align:center;color:var(--muted)}.join-code-label{display:block;font-size:.85rem;margin-bottom:.35rem}.join-code-value{display:inline-block;font-family:ui-monospace,SFMono-Regular,monospace;font-size:1.35rem;letter-spacing:.08em;color:var(--rune);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:.55rem 1rem}

[hidden]{display:none!important}.boot-progress{margin:1rem 0 1.2rem}.boot-progress-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.86rem;margin-bottom:.45rem}.boot-progress-head strong{color:var(--rune);font-weight:600}.boot-track{height:.65rem;border-radius:99px;background:var(--rule);overflow:hidden}.boot-bar{height:100%;width:0;background:var(--rune);border-radius:99px;transition:width .5s ease}
  .status-stack{display:flex;flex-direction:column;gap:.55rem;margin:0 auto 1.1rem}
  .status-stack .status-real{margin:0}
</style>
</head>

  <h1>Servidor do Marreco</h1>
  <p class="sub">Jogo Atual - Valheim</p>
  <div class="status-stack" aria-live="polite">
    <div id="machineStatus" class="status-real unavailable"><span class="status-dot"></span><span id="machineLabel">Máquina INDISPONÍVEL</span></div>
    <div id="serverStatus" class="status-real unavailable"><span class="status-dot"></span><span id="serverLabel">Servidor INDISPONÍVEL</span></div>
  </div>
  <div id="joinCodeBox" class="join-code-box" hidden><span class="join-code-label">Join Code</span><strong id="joinCodeValue" class="join-code-value"></strong></div>
  <div class="rune-divider">ᛗᚨᚱᚱᛖᚲᛟ ᛋᛖᚱᚹᛖᚱ</div>

  <button class="btn btn-ligar" id="btnLigar" type="button">Ligar servidor</button>
  <button class="btn btn-status" id="btnConfig" type="button" disabled>Configurações do Valheim</button>


  <div id="bootProgress" class="boot-progress" hidden><div class="boot-progress-head"><span id="bootLabel">Preparando...</span><strong id="bootPercent">0%</strong></div><div class="boot-track"><div id="bootBar" class="boot-bar"></div></div></div>
  <footer>marrecoserver.duckdns.org</footer>
</div>


<script>
const WORKER_URL='https://white-brook-c32d.ogioni-bh.workers.dev';
const SENHA='crbr';
let joinAutorizado=false;
let servidorAtivo=false;

function setProgress(percent,label){
  document.getElementById('bootBar').style.width=percent+'%';
  document.getElementById('bootPercent').textContent=percent+'%';
  document.getElementById('bootLabel').textContent=label;
}

async function lerStatusDetalhado(){
  try{
    const r=await fetch(WORKER_URL+'/status.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(data.esp!==true) throw new Error('ESP indisponível');
    return data;
  }catch(e){return null;}
}

function atualizarLed(id,labelId,nome,estado){
  const box=document.getElementById(id);
  const label=document.getElementById(labelId);
  if(estado===true){box.className='status-real on';label.textContent=nome+' LIGADA';}
  else if(estado===false){box.className='status-real off';label.textContent=nome+' DESLIGADA';}
  else{box.className='status-real unavailable';label.textContent=nome+' INDISPONÍVEL';}
}

async function atualizarJoinCode(ativo){
  const box=document.getElementById('joinCodeBox');
  const value=document.getElementById('joinCodeValue');
  if(!ativo || !joinAutorizado){box.hidden=true;box.style.display='none';value.textContent='';return;}
  try{
    const r=await fetch(WORKER_URL+'/joincode?senha='+SENHA+'&ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(data.joincode){value.textContent=data.joincode;box.hidden=false;box.style.display='block';}
    else{value.textContent='Aguardando Join Code...';box.hidden=false;box.style.display='block';}
  }catch(e){box.hidden=true;box.style.display='none';value.textContent='';}
}

async function atualizarStatusReal(){
  const data=await lerStatusDetalhado();
  const maquina=data ? data.maquina===true : null;
  const servidor=data ? data.servidor===true : null;
  atualizarLed('machineStatus','machineLabel','Máquina',maquina);
  atualizarLed('serverStatus','serverLabel','Servidor',servidor);
  servidorAtivo=servidor===true;
  const btn=document.getElementById('btnLigar');
  if(servidorAtivo){btn.textContent='Join Code';btn.className='btn btn-join';}
  else{btn.textContent='Ligar servidor';btn.className='btn btn-ligar';}
  const configBtn=document.getElementById('btnConfig');
  configBtn.disabled=servidorAtivo!==true;
  configBtn.className=servidorAtivo?'btn btn-join':'btn btn-status';
  await atualizarJoinCode(servidorAtivo);
  return servidor;
}

async function ligarServidor(){
  const senha=prompt(servidorAtivo?'Digite a senha para liberar o Join Code:':'Digite a senha para ligar o servidor:');
  if(senha===null) return;
  if(senha!==SENHA){alert('Senha inválida.');return;}
  if(servidorAtivo){
    joinAutorizado=true;
    await atualizarJoinCode(true);
    return;
  }
  const btn=document.getElementById('btnLigar');
  const progress=document.getElementById('bootProgress');
  btn.disabled=true; progress.hidden=false; setProgress(5,'Enviando comando...');
  try{
    const r=await fetch(WORKER_URL+'/ligar?senha='+encodeURIComponent(senha)+'&ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    joinAutorizado=true;
    setProgress(12,'Comando recebido. Aguardando servidor...');
    for(let i=0;i<40;i++){
      await new Promise(resolve=>setTimeout(resolve,3000));
      const ativo=await atualizarStatusReal();
      if(ativo===true){setProgress(100,'Servidor ativo!');document.getElementById('bootProgress').hidden=true;return;}
      setProgress(Math.min(95,12+Math.round((i+1)*2.05)),'Aguardando servidor...');
    }
    setProgress(95,'Ainda iniciando...');
  }catch(e){
    setProgress(0,'Não foi possível enviar o comando.');
  }finally{btn.disabled=false;}
}

document.getElementById('btnLigar').addEventListener('click',ligarServidor);
document.getElementById('btnConfig').addEventListener('click',()=>{ if(servidorAtivo===true) window.location.href='configuracoes_valheim.html'; });
atualizarStatusReal();
setInterval(atualizarStatusReal,15000);
</script>
